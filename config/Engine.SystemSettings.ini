; Merge this section into the game's user Engine.ini with config/apply-system-settings.sh:
;   <bottle>/drive_c/users/crossover/AppData/Local/SoulcaliburVI/Saved/Config/WindowsNoEditor/Engine.ini
; Do not replace that file. It already holds [Core.System] and other sections.
;
; Why [SystemSettings]: UE4 applies these values with "system settings ini" priority,
; which is higher than the scalability groups (sg.*) that the in-game graphics menu
; changes. So the menu cannot turn these effects back on. Device profiles and the
; console still have higher priority; SC6's Windows device profile sets no CVars.
; It is unverified that this shipping build reads the user [SystemSettings] section.
;
; Goal: every post-processing pass off, to lower GPU time per frame (target: 120 fps).
; The tonemapper stays, because it writes the final image; only its extras are off.

[SystemSettings]
; Bloom (about 20 passes at the end of the frame; specs/renderer-frame-structure.md stage 15).
r.BloomQuality=0
; Screen-space ambient occlusion.
r.AmbientOcclusionLevels=0
r.AmbientOcclusionMaxQuality=0
; Screen-space reflections.
r.SSR.Quality=0
; Auto exposure (eye adaptation). 0 = fixed exposure, no histogram passes.
r.EyeAdaptationQuality=0
; Motion blur.
r.MotionBlurQuality=0
; Depth of field, including cinematic camera DoF from post-process volumes.
r.DepthOfFieldQuality=0
; Lens flares (image-based flare pass).
r.LensFlareQuality=0
; Chromatic aberration (scene color fringe).
r.SceneColorFringeQuality=0
; Light shafts (god rays) from directional lights.
r.LightShaftQuality=0
; Screen-space subsurface scattering on skin. 0 = off; skin looks flatter.
r.SSS.Quality=0
r.SubsurfaceScattering=0
; Anti-aliasing post pass (FXAA or TAA). The in-game setting is already off.
r.PostProcessAAQuality=0
; Tonemapper: 0 keeps the tone curve but drops sharpening, vignette, and film grain.
r.Tonemapper.Quality=0
r.Tonemapper.GrainQuantization=0
r.Tonemapper.Sharpen=0
